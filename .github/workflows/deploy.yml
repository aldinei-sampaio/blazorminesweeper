name: Build and Deploy Blazor WASM (.NET 10)

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish project
        working-directory: src/BlazorMinesweeper
        run: dotnet publish -c Release

      - name: Remove sourceMappingURL
        run: |
          find src/BlazorMinesweeper/bin/Release/net10.0/publish/wwwroot/_framework -type f -name "*.js" -exec sed -i '/sourceMappingURL/d' {} \;

      - name: Prepare output
        run: |
          cp src/BlazorMinesweeper/bin/Release/net10.0/publish/wwwroot/index.html src/BlazorMinesweeper/bin/Release/net10.0/publish/wwwroot/404.html
          touch src/BlazorMinesweeper/bin/Release/net10.0/publish/wwwroot/.nojekyll

      - name: Deploy to GitHub Pages repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PUBLISH_TOKEN }}
          external_repository: aldinei-sampaio/aldinei-sampaio.github.io
          publish_branch: main
          publish_dir: src/BlazorMinesweeper/bin/Release/net10.0/publish/wwwroot
          force_orphan: true
